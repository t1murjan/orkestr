[project]
name = "orkestr"
version = "0.1.0"
description = "Пульт управления и мониторинга ИИ-агентов Claude Code и OpenCode"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "psutil>=5.9",
    "mcp>=1.9",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
orkestr = "orkestr.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["orkestr", "orkestr.runtimes", "orkestr.probes", "orkestr.watchers"]

[tool.setuptools.package-data]
orkestr = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
